[package]
name = "lighting-host"
version = "0.1.20"
edition = "2021"
description = "Lighting USB/LAN second-display host for Windows"

[lib]
name = "lighting_host"
path = "src/lib.rs"

[[bin]]
name = "lighting-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"

[target.'cfg(windows)'.dependencies]
eframe = "0.32"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
