name: Build Electron Windows UI

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "host-ui/**"
      - "host-windows/**"
      - "scripts/**"
      - ".github/workflows/build-electron-win.yml"
  pull_request:
    branches: [main]
    paths:
      - "host-ui/**"
      - "host-windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host-windows

      - name: Build lighting-host.exe
        working-directory: host-windows
        run: cargo build --release

      - name: Stage host next to Electron resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path host-ui/resources | Out-Null
          Copy-Item host-windows/target/release/lighting-host.exe host-ui/resources/lighting-host.exe -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host-ui/package-lock.json

      - name: Install UI deps
        working-directory: host-ui
        run: npm ci

      - name: Build Windows packages
        working-directory: host-ui
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lighting副屏-一键版
          path: |
            host-ui/release/*便携版.exe
            host-ui/release/*安装包.exe
          if-no-files-found: error
